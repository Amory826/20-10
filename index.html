<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>women's day</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.2.3/css/bootstrap-grid.min.css"
        integrity="sha512-JQksK36WdRekVrvdxNyV3B0Q1huqbTkIQNbz1dlcFVgNynEMRl0F8OSqOGdVppLUDIvsOejhr/W5L3G/b3J+8w=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css"
        integrity="sha512-MV7K8+y+gLIBoVD59lQIYicR65iaqukzvf/nwasF0nqhPay5w/9lJmVM2hMDcnK1OnMGCdVK+iQrJ7lzPJQd1w=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Pacifico&family=Quicksand:wght@500;600;700;800&family=Montserrat:wght@400;600;700;800;900&display=swap"
        rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>

    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            background-color: #fae1dd;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        /* First Screen: Rose */
        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            position: relative;
            cursor: pointer;
            overflow: hidden;
            background-color: #fae1dd;
        }

        .container svg {
            width: 85%;
            max-width: 460px;
            height: auto;
            max-height: 60vh;
            display: block;
            filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.12));
        }

        #text-click {
            display: none;
            position: absolute;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Pacifico', 'Dancing Script', cursive;
            color: #d62828;
            font-size: clamp(24px, 6vw, 42px);
            cursor: pointer;
            text-align: center;
            width: 90%;
            user-select: none;
            letter-spacing: 1px;
            animation: pulse-click 1.5s ease-in-out infinite;
        }

        @keyframes pulse-click {

            0%,
            100% {
                transform: translateX(-50%) scale(1);
                opacity: 0.85;
            }

            50% {
                transform: translateX(-50%) scale(1.08);
                opacity: 1;
                text-shadow: 0 0 16px rgba(214, 40, 40, 0.45);
            }
        }

        /* SVG Heart Text Path */
        #theSvg,
        #theSvg * {
            pointer-events: none !important;
        }

        #theSvg {
            width: 92%;
            max-width: 580px;
            max-height: 82vh;
            display: block;
            position: absolute;
            margin: auto;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 1;
            pointer-events: none !important;
        }

        text {
            fill: #e6668a;
            font-family: consolas, monospace;
            font-size: 9px;
            pointer-events: none !important;
        }

        /* Castle / Envelope Screen */
        #castle {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            background-color: transparent;
            position: relative;
            overflow: hidden;
            z-index: 5;
        }

        #main,
        #sub {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .dustDef {
            position: absolute;
            background-color: white;
            border-radius: 100%;
            box-shadow: 0 0 3px 1px white;
            opacity: 0;
        }

        .letter {
            position: relative;
            z-index: 3;
            transform-origin: center center;
            transition: transform 0.3s ease;
        }

        @media (max-width: 420px) {
            .letter {
                transform: scale(0.9);
            }
        }

        @media (max-width: 350px) {
            .letter {
                transform: scale(0.8);
            }
        }

        .valentines {
            position: relative;
            top: 30px;
            cursor: pointer;
            animation: up 3s linear infinite;
            -webkit-tap-highlight-color: transparent;
        }

        @keyframes up {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-28px);
            }
        }

        .envelope {
            position: relative;
            width: 300px;
            height: 200px;
            background-color: #f08080;
        }

        .envelope:before {
            background-color: #f08080;
            content: "";
            position: absolute;
            width: 212px;
            height: 212px;
            transform: rotate(45deg);
            top: -105px;
            left: 44px;
            border-radius: 30px 0 0 0;
        }

        .card {
            position: absolute;
            background-color: #eae2b7;
            width: 270px;
            height: 170px;
            top: 5px;
            left: 15px;
            box-shadow: -5px -5px 100px rgba(0, 0, 0, 0.4);
            cursor: pointer;
        }

        .card:before {
            content: "";
            position: absolute;
            border: 3px solid #003049;
            border-style: dotted;
            width: 240px;
            height: 140px;
            left: 12px;
            top: 12px;
        }

        .text {
            position: absolute;
            font-family: 'Dancing Script', 'Brush Script MT', cursive;
            font-size: 28px;
            text-align: center;
            line-height: 26px;
            top: 19px;
            left: 85px;
            color: #003049;
            pointer-events: none;
        }

        .heart {
            background-color: #d62828;
            display: inline-block;
            height: 30px;
            margin: 0 10px;
            position: relative;
            top: 110px;
            left: 105px;
            transform: rotate(-45deg);
            width: 30px;
        }

        .heart:before,
        .heart:after {
            content: "";
            background-color: #d62828;
            border-radius: 50%;
            height: 30px;
            position: absolute;
            width: 30px;
        }

        .heart:before {
            top: -15px;
            left: 0;
        }

        .heart:after {
            left: 15px;
            top: 0;
        }

        .hearts {
            position: absolute;
            top: 0;
        }

        .one,
        .two,
        .three,
        .four,
        .five {
            background-color: red;
            display: inline-block;
            height: 10px;
            margin: 0 10px;
            position: relative;
            transform: rotate(-45deg);
            width: 10px;
            top: 50px;
        }

        .one:before,
        .one:after,
        .two:before,
        .two:after,
        .three:before,
        .three:after,
        .four:before,
        .four:after,
        .five:before,
        .five:after {
            content: "";
            background-color: red;
            border-radius: 50%;
            height: 10px;
            position: absolute;
            width: 10px;
        }

        .one:before,
        .two:before,
        .three:before,
        .four:before,
        .five:before {
            top: -5px;
            left: 0;
        }

        .one:after,
        .two:after,
        .three:after,
        .four:after,
        .five:after {
            left: 5px;
            top: 0;
        }

        .one {
            left: 10px;
            animation: heart 1s ease-out infinite;
        }

        .two {
            left: 30px;
            animation: heart 2s ease-out infinite;
        }

        .three {
            left: 50px;
            animation: heart 1.5s ease-out infinite;
        }

        .four {
            left: 70px;
            animation: heart 2.3s ease-out infinite;
        }

        .five {
            left: 90px;
            animation: heart 1.7s ease-out infinite;
        }

        @keyframes heart {
            0% {
                transform: translateY(0) rotate(-45deg) scale(0.3);
                opacity: 1;
            }

            100% {
                transform: translateY(-150px) rotate(-45deg) scale(1.3);
                opacity: 0.5;
            }
        }

        .front {
            position: absolute;
            border-right: 180px solid #f4978e;
            border-top: 95px solid transparent;
            border-bottom: 100px solid transparent;
            left: 120px;
            top: 5px;
            width: 0;
            height: 0;
            z-index: 10;
            pointer-events: none;
        }

        .front:before {
            position: absolute;
            content: "";
            border-left: 300px solid #f8ad9d;
            border-top: 195px solid transparent;
            left: -120px;
            top: -95px;
            width: 0;
            height: 0;
        }

        .shadow {
            position: absolute;
            width: 330px;
            height: 25px;
            border-radius: 50%;
            background-color: rgba(0, 0, 0, 0.3);
            top: 265px;
            left: -15px;
            animation: scale 3s linear infinite;
            z-index: -1;
        }

        @keyframes scale {

            0%,
            100% {
                transform: scaleX(1);
            }

            50% {
                transform: scaleX(0.85);
            }
        }

        /* Popup Letter Modal */
        .wrapperLetterForm {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            z-index: 10000;
            background: rgba(0, 0, 0, 0.72);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: none;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .boxLetter {
            width: 100%;
            min-height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 14px;
            position: relative;
        }

        .cardLetterWrapper {
            position: relative;
            width: 95%;
            max-width: 600px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: auto;
        }

        .cardLetterWrapper .before,
        .boxLetter .before {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            transform: rotate(-4deg);
            border-radius: 20px;
            z-index: 10;
            box-shadow: rgba(0, 0, 0, 0.15) 0px 4px 18px;
            pointer-events: none;
            transition: transform 0.3s ease;
        }

        @media (min-width: 768px) {

            .cardLetterWrapper .before,
            .boxLetter .before {
                transform: rotate(-6deg);
            }
        }

        .cardLetterWrapper .formLetter,
        .boxLetter .formLetter {
            position: relative;
            width: 100%;
            min-height: 380px;
            background-color: #FFEBEB;
            border-radius: 20px;
            z-index: 20;
            padding: 18px 16px;
            box-shadow: rgba(0, 0, 0, 0.28) 0px 8px 30px;
            cursor: pointer;
        }

        .formLetter .wrapperLetter {
            position: relative;
            width: 100%;
            min-height: 340px;
            border: 2px dashed #FF6666;
            border-radius: inherit;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px 14px 64px 14px;
            overflow: hidden;
        }

        .formLetter .heartLetter {
            position: absolute;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #FFEBEB;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .heartLetter .heartLetterItem {
            position: relative;
            width: 9px;
            height: 9px;
            transform: rotate(45deg);
            background: #FF6666;
        }

        .heartLetter:first-child {
            right: 8px;
            top: 8px;
        }

        .heartLetter:nth-child(2) {
            left: 8px;
            bottom: 8px;
        }

        .heartLetterItem::before,
        .heartLetterItem::after {
            position: absolute;
            content: '';
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: inherit;
        }

        .heartLetterItem::before {
            top: -50%;
        }

        .heartLetterItem::after {
            left: -50%;
        }

        .giftbox {
            position: absolute;
            top: 12px;
            left: 12px;
            width: 44px;
            height: 44px;
            z-index: 20;
        }

        .giftbox .img {
            width: 100%;
            height: 100%;
        }

        .giftbox img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .textLetter {
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            user-select: none;
            z-index: 25;
            padding: 8px 6px;
        }

        .textLetter h2 {
            font-size: clamp(24px, 5.5vw, 32px);
            font-family: 'Dancing Script', cursive;
            color: #d62828;
            margin-bottom: 10px;
            text-align: center;
        }

        .textLetter .contentLetter {
            font-size: clamp(15px, 3.6vw, 18px);
            text-align: center;
            padding: 0 10px;
            font-family: 'Dancing Script', cursive;
            line-height: 1.65;
            color: #2b2b2b;
            position: relative;
            word-wrap: break-word;
            white-space: pre-line;
        }

        .fa-xmark {
            position: absolute;
            right: 16px;
            top: 16px;
            color: #fff;
            cursor: pointer;
            font-size: 24px;
            z-index: 200;
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transition: all 0.2s ease;
        }

        .fa-xmark:hover,
        .fa-xmark:active {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(1.1);
        }

        .heartAnimation {
            position: absolute;
            width: clamp(120px, 30vw, 180px);
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0.35;
            pointer-events: none;
            z-index: 10;
        }

        .heartAnimation img {
            width: 100%;
            display: block;
        }

        .mewmew1,
        .mewmew2 {
            position: absolute;
            width: clamp(55px, 14vw, 85px);
            bottom: 5px;
            z-index: 30;
            pointer-events: none;
        }

        .mewmew1 {
            left: 8px;
        }

        .mewmew2 {
            right: 8px;
        }

        .mewmew1 img,
        .mewmew2 img {
            width: 100%;
            display: block;
        }

        /* 3D Love Galaxy Screen */
        #galaxy-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            z-index: 99999;
            background: #030107;
            background: radial-gradient(circle at center, #1a0820 0%, #0d0314 55%, #030107 100%);
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        #galaxy-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 1;
        }

        /* Controls */
        .galaxy-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 12px;
            z-index: 30;
        }

        .control-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #ffffff;
            font-size: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.25s ease;
            outline: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            -webkit-tap-highlight-color: transparent;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.28);
            transform: scale(1.1);
            box-shadow: 0 0 18px rgba(255, 75, 110, 0.6);
        }

        .control-btn:active {
            transform: scale(0.95);
        }

        .control-btn.playing {
            color: #ff4d6d;
            border-color: rgba(255, 77, 109, 0.7);
            box-shadow: 0 0 15px rgba(255, 77, 109, 0.5);
            animation: spinSlow 9s linear infinite;
        }

        @keyframes spinSlow {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <svg style="display: none;" id="theSvg" viewBox="-120 -30 240 180" enable-background="new 0 0 174 148"
        xml:space="preserve">
        <defs>
            <filter id="f" filterUnits="userSpaceOnUse" x="-120" y="-30" width="120%" height="120%">
                <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"></feGaussianBlur>
                <feOffset in="blur" dx="3" dy="5" result="shadow"></feOffset>
                <feFlood flood-color="rgba(3,0,0,1)" result="color" />
                <feComposite in="color" in2="shadow" operator="in" />
                <feComposite in="SourceGraphic" />
            </filter>
            <path id="shape" d="M0, 21.054 
       C0, 21.054 24.618, -15.165 60.750, 8.554 
       C93.249, 29.888 57.749, 96.888 0, 117.388
       C-57.749, 96.888  -93.249, 29.888 -60.750, 8.554
       C-24.618, -15.165  -0, 21.054 -0, 21.054z    
    " />
            <path id="partialPath" />

        </defs>

        <text dy="-2">
            <textPath style="font-family: fantasy;" xlink:href="#partialPath" startOffset="12">
                🌹Happy Women's Day
                🌹.........................................................................................................................................🌹From
                With Love 20/10!🌹
            </textPath>
        </text>

        <use id="useThePath" xlink:href="#partialPath" stroke="white" stroke-width=".5" stroke-opacity=".5" fill="none"
            style="display:none;" />
    </svg>

    <script>
        let rid = null; // request animation id
        const SVG_NS = "http://www.w3.org/2000/svg";
        const pathlength = shape.getTotalLength();

        let t = 0; // at the begining of the path
        let lengthAtT = pathlength * t;

        let d = shape.getAttribute("d");

        // 1. build the d array
        let n = d.match(/C/gi).length; // how many times

        let pos = 0; // the position, used to find the indexOf the nth C

        class subPath {
            constructor(d) {
                this.d = d;
                this.get_PointsRy();
                this.previous = subpaths.length > 0 ? subpaths[subpaths.length - 1] : null;
                this.measurePath();
                this.get_M_Point(); //lastPoint
                this.lastCubicBezier;
                this.get_lastCubicBezier();
            }

            get_PointsRy() {
                this.pointsRy = [];
                let temp = this.d.split(/[A-Z,a-z\s,]/).filter(v => v); // remove empty elements
                temp.map(item => {
                    this.pointsRy.push(parseFloat(item));
                }); //this.pointsRy numbers not strings
            }

            measurePath() {
                let path = document.createElementNS(SVG_NS, "path");
                path.setAttributeNS(null, "d", this.d);
                // no need to append it to the SVG
                // the lengths of every path in dry
                this.pathLength = path.getTotalLength();
            }

            get_M_Point() {
                if (this.previous) {
                    let p = this.previous.pointsRy;
                    let l = p.length;
                    this.M_point = [p[l - 2], p[l - 1]];
                } else {
                    let p = this.pointsRy;
                    this.M_point = [p[0], p[1]];
                }
            }

            get_lastCubicBezier() {
                let lastIndexOfC = this.d.lastIndexOf("C");
                let temp = this.d
                    .substring(lastIndexOfC + 1)
                    .split(/[\s,]/)
                    .filter(v => v);
                let _temp = [];
                temp.map(item => {
                    _temp.push(parseFloat(item));
                });
                this.lastCubicBezier = [this.M_point];
                for (let i = 0; i < _temp.length; i += 2) {
                    this.lastCubicBezier.push(_temp.slice(i, i + 2));
                }
            }
        }

        let subpaths = [];

        // create new subPaths
        for (let i = 0; i < n; i++) {
            // finds the of nth C in d
            let newpos = d.indexOf("C", pos + 1);
            if (i > 0) {
                // if it's not the first C
                let sPath = new subPath(d.substring(0, newpos));
                subpaths.push(sPath);
            }
            //change the value of the position pos
            pos = newpos;
        }
        // at the end add d to the subpaths array
        subpaths.push(new subPath(d));

        // 2. get the index of the bezierLengths where the point at t is
        let index;
        for (index = 0; index < subpaths.length; index++) {
            if (subpaths[index].pathLength >= lengthAtT) {
                break;
            }
        }

        function get_T(t, index) {
            if (index >= subpaths.length) index = subpaths.length - 1;
            let T;
            lengthAtT = pathlength * t;
            if (index > 0 && subpaths[index] && subpaths[index].previous) {
                T =
                    (lengthAtT - subpaths[index].previous.pathLength) /
                    (subpaths[index].pathLength - subpaths[index].previous.pathLength);
            } else if (subpaths[index]) {
                T = lengthAtT / subpaths[index].pathLength;
            } else {
                T = 1;
            }
            return Math.max(0, Math.min(1, T));
        }

        let T = get_T(t, index);

        let newPoints = getBezierPoints(T, subpaths[index].lastCubicBezier);

        drawCBezier(newPoints, partialPath, index);

        function getBezierPoints(t, points) {
            let helperPoints = [];

            // helper points 0,1,2
            for (let i = 1; i < 4; i++) {
                //points.length must be 4 !!!
                let p = lerp(points[i - 1], points[i], t);
                helperPoints.push(p);
            }

            // helper points 3,4
            helperPoints.push(lerp(helperPoints[0], helperPoints[1], t));
            helperPoints.push(lerp(helperPoints[1], helperPoints[2], t));

            // helper point 5 is where the first Bézier ends and where the second Bézier begins
            helperPoints.push(lerp(helperPoints[3], helperPoints[4], t));

            // points for the dynamic bézier
            let firstBezier = [
                points[0],
                helperPoints[0],
                helperPoints[3],
                helperPoints[5]
            ];
            //console.log(firstBezier)
            return firstBezier;
        }

        function lerp(A, B, t) {
            let ry = [
                (B[0] - A[0]) * t + A[0], //x
                (B[1] - A[1]) * t + A[1] //y
            ];
            return ry;
        }

        function drawCBezier(points, path, index) {
            let d;

            if (index > 0) {
                d = subpaths[index].previous.d;
            } else {
                d = `M${points[0][0]},${points[0][1]} C`;
            }

            // points.length == 4
            for (let i = 1; i < 4; i++) {
                d += ` ${points[i][0]},${points[i][1]} `;
            }
            //console.log(d)
            partialPath.setAttributeNS(null, "d", d);
        }
    </script>

                    rid = window.requestAnimationFrame(Typing);
                    function Typing() {
                        if (t >= 1) {
                            t = 1;
                            if (rid) window.cancelAnimationFrame(rid);
                            rid = null;
                        } else {
                            t += 0.0025;
                            rid = window.requestAnimationFrame(Typing);
                        }

                        lengthAtT = pathlength * t;
                        for (index = 0; index < subpaths.length; index++) {
                            if (subpaths[index].pathLength >= lengthAtT) {
                                break;
                            }
                        }
                        if (index >= subpaths.length) index = subpaths.length - 1;

                        if (subpaths[index]) {
                            T = get_T(t, index);
                            newPoints = getBezierPoints(T, subpaths[index].lastCubicBezier);
                            drawCBezier(newPoints, partialPath, index);
                        }
                    }
                };

                ctx.translate(x, y);
                const s = size / 30;
                ctx.scale(s, s);
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.bezierCurveTo(-14, -14, -28, 4, 0, 24);
                ctx.bezierCurveTo(28, 4, 14, -14, 0, 0);
                ctx.fillStyle = color;
                ctx.globalAlpha = alpha;
                ctx.shadowColor = color;
                ctx.shadowBlur = Math.min(14, size * 0.7);
                ctx.fill();
                ctx.restore();
            }

            function spawnHeartBurst(x, y, count = 100) {
                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 8 + 2;
                    const isHeart = Math.random() < 0.45;
                    particles.push({
                        x: x,
                        y: y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        size: Math.random() * 12 + 6,
                        color: colors[Math.floor(Math.random() * colors.length)],
                        alpha: 1,
                        decay: Math.random() * 0.015 + 0.01,
                        rot: Math.random() * Math.PI * 2,
                        vRot: (Math.random() - 0.5) * 0.1,
                        isHeart: isHeart
                    });
                }
            }

            // Climax Swirling Letters (video 00:19)
            function triggerClimaxEffect() {
                climaxTriggered = true;
                const cx = width / 2;
                const cy = height / 2;

                // Firework explosion in center
                spawnHeartBurst(cx, cy, 120);

                // Swirling flying letters
                const burstChars = ['u', 'p', 'b', 'E', 'h', 'a', 'o', 'd', 'n', 't', '!', '?', '♥', '♪', 'y', 'ê', 'u', 'c', 'h', 'ơ', 'i'];
                for (let i = 0; i < 55; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 6.5 + 2.5;
                    burstLetters.push({
                        char: burstChars[Math.floor(Math.random() * burstChars.length)],
                        x: cx + (Math.random() - 0.5) * 40,
                        y: cy + (Math.random() - 0.5) * 40,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        rot: Math.random() * Math.PI * 2,
                        vRot: (Math.random() - 0.5) * 0.09,
                        scale: 0.4,
                        scaleGrowth: Math.random() * 0.022 + 0.016,
                        alpha: 1,
                        color: Math.random() > 0.4 ? '#ffffff' : colors[Math.floor(Math.random() * colors.length)]
                    });
                }
            }

            function spawnTapHeart(x, y) {
                floatingHearts.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 2,
                    vy: -(Math.random() * 3 + 2.5),
                    size: Math.random() * 14 + 14,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    alpha: 1,
                    decay: 0.018,
                    rot: (Math.random() - 0.5) * 0.4
                });
            }

            function loop(timestamp) {
                if (!isRunning) return;
                const time = timestamp * 0.001;

                // 1. Clear background with subtle cosmic gradient
                ctx.clearRect(0, 0, width, height);

                const grad = ctx.createRadialGradient(width / 2, height / 2, 20, width / 2, height / 2, Math.max(width, height) * 0.7);
                grad.addColorStop(0, '#1c0824');
                grad.addColorStop(0.5, '#0d0314');
                grad.addColorStop(1, '#030107');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, width, height);

                // 2. Render background starfield
                for (let i = 0; i < stars.length; i++) {
                    const star = stars[i];
                    const twinkle = Math.sin(time * 3 + star.twinklePhase) * 0.35 + 0.65;
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffffff';
                    ctx.globalAlpha = star.alpha * twinkle;
                    ctx.shadowColor = '#ffffff';
                    ctx.shadowBlur = 4;
                    ctx.fill();
                    ctx.restore();
                }

                // 3. Render Falling Love Rain if in FALLING state
                if (state === 'FALLING') {
                    // Climax check at ~18.2s
                    if (bgMusic && bgMusic.currentTime >= 18.2 && !climaxTriggered) {
                        triggerClimaxEffect();
                    }

                    // Smooth wind decay
                    windX += (targetWindX - windX) * 0.05;
                    targetWindX *= 0.96;

                    // Sort back to front (z ascending)
                    fallingItems.sort((a, b) => a.z - b.z);

                    for (let i = 0; i < fallingItems.length; i++) {
                        const item = fallingItems[i];

                        // Falling movement
                        item.y += item.speed;
                        item.x += Math.sin(time * item.swaySpeed + item.swayPhase) * item.swayAmp + windX;

                        // Wrap when reaching bottom
                        if (item.y > height + 60) {
                            item.y = -60 - Math.random() * 60;
                            item.x = Math.random() * (width + 80) - 40;
                            item.z = (Math.random() - 0.5) * 400;
                            const fov = 380;
                            const cameraDist = 420;
                            item.scale = fov / (cameraDist + item.z);
                            item.speed = (Math.random() * 0.9 + 0.8) * item.scale;
                            item.alpha = Math.max(0.48, Math.min(1.0, (item.z + 200) / 400 * 0.52 + 0.48));
                            item.isHeart = Math.random() < 0.22;
                            item.text = loveTexts[Math.floor(Math.random() * loveTexts.length)];
                            item.color = colors[Math.floor(Math.random() * colors.length)];
                            const isShort = item.text.length <= 8;
                            item.baseSize = item.isHeart
                                ? (Math.random() * 6 + 16)
                                : (isShort ? (Math.random() * 4 + 14) : (Math.random() * 4 + 15));
                        }

                        // Render
                        if (item.x < -120 || item.x > width + 120 || item.y < -80 || item.y > height + 80) continue;

                        if (item.isHeart) {
                            drawHeart(item.x, item.y, item.baseSize * item.scale, item.color, item.alpha);
                        } else {
                            ctx.save();
                            const fontSize = Math.round(item.baseSize * item.scale);
                            ctx.font = `800 ${fontSize}px "Montserrat", "Segoe UI", sans-serif`;
                            ctx.fillStyle = item.color;
                            ctx.globalAlpha = item.alpha;
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'middle';
                            ctx.shadowColor = item.color;
                            ctx.shadowBlur = Math.min(12, 6 * item.scale);
                            // Thicken text strokes
                            ctx.lineWidth = Math.max(0.8, fontSize * 0.05);
                            ctx.strokeStyle = item.color;
                            ctx.strokeText(item.text, item.x, item.y);
                            ctx.fillText(item.text, item.x, item.y);
                            ctx.restore();
                        }
                    }

                    // 4. Update & draw burst letters (Climax)
                    for (let i = burstLetters.length - 1; i >= 0; i--) {
                        const bl = burstLetters[i];
                        bl.x += bl.vx;
                        bl.y += bl.vy;
                        bl.rot += bl.vRot;
                        bl.scale += bl.scaleGrowth;
                        bl.vx *= 0.99;
                        bl.vy *= 0.99;
                        if (bl.scale > 1.8) {
                            bl.alpha -= 0.018;
                        }
                        if (bl.alpha <= 0) {
                            burstLetters.splice(i, 1);
                            continue;
                        }

                        ctx.save();
                        ctx.translate(bl.x, bl.y);
                        ctx.rotate(bl.rot);
                        ctx.font = `800 ${Math.round(22 * bl.scale)}px "Montserrat", sans-serif`;
                        ctx.fillStyle = bl.color;
                        ctx.globalAlpha = Math.max(0, bl.alpha);
                        ctx.shadowColor = bl.color;
                        ctx.shadowBlur = 12 * bl.scale;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(bl.char, 0, 0);
                        ctx.restore();
                    }

                    // 5. Update & draw explosion particles
                    for (let i = particles.length - 1; i >= 0; i--) {
                        const pt = particles[i];
                        pt.x += pt.vx;
                        pt.y += pt.vy;
                        pt.vx *= 0.97;
                        pt.vy *= 0.97;
                        pt.rot += pt.vRot;
                        pt.alpha -= pt.decay;
                        if (pt.alpha <= 0) {
                            particles.splice(i, 1);
                            continue;
                        }

                        if (pt.isHeart) {
                            drawHeart(pt.x, pt.y, pt.size, pt.color, pt.alpha);
                        } else {
                            ctx.save();
                            ctx.beginPath();
                            ctx.arc(pt.x, pt.y, pt.size * 0.4, 0, Math.PI * 2);
                            ctx.fillStyle = pt.color;
                            ctx.globalAlpha = pt.alpha;
                            ctx.shadowColor = pt.color;
                            ctx.shadowBlur = 8;
                            ctx.fill();
                            ctx.restore();
                        }
                    }

                    // 6. Update & draw interactive floating hearts
                    for (let i = floatingHearts.length - 1; i >= 0; i--) {
                        const fh = floatingHearts[i];
                        fh.x += fh.vx;
                        fh.y += fh.vy;
                        fh.alpha -= fh.decay;
                        if (fh.alpha <= 0) {
                            floatingHearts.splice(i, 1);
                            continue;
                        }
                        drawHeart(fh.x, fh.y, fh.size, fh.color, fh.alpha);
                    }
                }

                animationFrameId = requestAnimationFrame(loop);
            }

            function start() {
                resize();
                initStars();
                initFallingItems();
                state = 'FALLING';
                climaxTriggered = false;
                particles = [];
                burstLetters = [];
                floatingHearts = [];

                if (controls) controls.style.display = 'flex';

                // Play Audio
                if (bgMusic) {
                    bgMusic.currentTime = 0;
                    const playPromise = bgMusic.play();
                    if (playPromise !== undefined) {
                        playPromise.then(() => {
                            if (btnMusic) btnMusic.classList.add('playing');
                        }).catch(e => {
                            console.log("Audio play caught:", e);
                            if (btnMusic) btnMusic.classList.add('playing');
                        });
                    }
                }

                // Heart blast burst in center
                spawnHeartBurst(width / 2, height / 2, 120);

                isRunning = true;
                if (animationFrameId) cancelAnimationFrame(animationFrameId);
                animationFrameId = requestAnimationFrame(loop);
            }

            function stop() {
                isRunning = false;
                if (animationFrameId) {
                    cancelAnimationFrame(animationFrameId);
                    animationFrameId = null;
                }
                if (bgMusic) {
                    bgMusic.pause();
                }
                if (btnMusic) btnMusic.classList.remove('playing');
            }

            // Event Listeners for Touch/Mouse interaction
            window.addEventListener('resize', () => {
                resize();
                initStars();
                initFallingItems();
            });

            // Drag / Touch interaction for wind and sway
            if (canvas) {
                canvas.addEventListener('mousedown', (e) => {
                    if (state !== 'FALLING') return;
                    isDragging = true;
                    lastMouseX = e.clientX;
                });

                window.addEventListener('mousemove', (e) => {
                    if (state !== 'FALLING') return;
                    if (isDragging) {
                        const dx = e.clientX - lastMouseX;
                        targetWindX = dx * 0.12;
                        lastMouseX = e.clientX;
                    }
                });

                window.addEventListener('mouseup', () => {
                    isDragging = false;
                });

                canvas.addEventListener('touchstart', (e) => {
                    if (state !== 'FALLING') return;
                    if (e.touches.length === 1) {
                        isDragging = true;
                        lastTouchX = e.touches[0].clientX;
                        spawnTapHeart(lastTouchX, e.touches[0].clientY);
                    }
                }, { passive: true });

                canvas.addEventListener('touchmove', (e) => {
                    if (state !== 'FALLING' || !isDragging) return;
                    if (e.touches.length === 1) {
                        const tx = e.touches[0].clientX;
                        const dx = tx - lastTouchX;
                        targetWindX = dx * 0.15;
                        lastTouchX = tx;
                    }
                }, { passive: true });

                canvas.addEventListener('touchend', () => {
                    isDragging = false;
                });

                // Click to spawn floating hearts
                canvas.addEventListener('click', (e) => {
                    if (state === 'FALLING') {
                        spawnTapHeart(e.clientX, e.clientY);
                    }
                });
            }

            // Controls
            if (btnMusic) {
                btnMusic.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (!bgMusic) return;
                    if (bgMusic.paused) {
                        bgMusic.play();
                        btnMusic.classList.add('playing');
                    } else {
                        bgMusic.pause();
                        btnMusic.classList.remove('playing');
                    }
                });
            }

            if (btnReplay) {
                btnReplay.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (bgMusic) {
                        bgMusic.currentTime = 0;
                        bgMusic.play();
                        if (btnMusic) btnMusic.classList.add('playing');
                    }
                    climaxTriggered = false;
                    spawnHeartBurst(width / 2, height / 2, 80);
                });
            }

            if (btnBack) {
                btnBack.addEventListener('click', (e) => {
                    e.stopPropagation();
                    stop();
                    $('#galaxy-container').fadeOut(300, () => {
                        $('#castle').fadeIn(300);
                        openLetterModal();
                    });
                });
            }

            // Music loop handling
            if (bgMusic) {
                bgMusic.addEventListener('ended', () => {
                    bgMusic.currentTime = 0;
                    bgMusic.play();
                    climaxTriggered = false;
                });
            }

            return {
                start: start,
                stop: stop
            };
        })();

        // Start Galaxy Experience transition
        function startGalaxyExperience() {
            if (timoutTextLetter) clearInterval(timoutTextLetter);
            if (timoutTextLetterContent) clearInterval(timoutTextLetterContent);
            if (autoTransitionTimer) clearTimeout(autoTransitionTimer);
            $('.wrapperLetterForm').stop(true, true).fadeOut(300);
            $('#castle, #rose-t, #theSvg').fadeOut(350, () => {
                $('#galaxy-container').fadeIn(400, () => {
                    galaxyEngine.start();
                });
            });
        }

        $(document).ready(function () {
            // Hover for desktop
            $('.valentines').mouseenter(function () {
                if (!$('.wrapperLetterForm').is(':visible')) {
                    $('.card').stop().animate({
                        top: '-90px'
                    }, 'slow');
                }
            }).mouseleave(function () {
                if (!$('.wrapperLetterForm').is(':visible')) {
                    $('.card').stop().animate({
                        top: '0px'
                    }, 'slow');
                }
            });

            // Tap / click support for mobile and desktop
            $(document).on('click', '.letter, .valentines, .card, .envelope', function (e) {
                if ($('.wrapperLetterForm').is(':visible')) return;
                openLetterModal();
            });

            $(document).on('click', '.fa-xmark', function (e) {
                e.stopPropagation();
                closeLetterModal();
            });

            // Tap backdrop to close and enter effect
            $(document).on('click', '.wrapperLetterForm', function (e) {
                if (e.target === this || $(e.target).hasClass('boxLetter')) {
                    closeLetterModal();
                }
            });

            // Tap inside letter while typing to finish instantly, or tap to enter effect
            $('.formLetter').on('click', function (e) {
                if ($(e.target).closest('#btnOpenGalaxy').length) return;
                if (timoutTextLetterContent || timoutTextLetter) {
                    if (timoutTextLetter) clearInterval(timoutTextLetter);
                    if (timoutTextLetterContent) clearInterval(timoutTextLetterContent);
                    timoutTextLetter = null;
                    timoutTextLetterContent = null;
                    textLetter.textContent = textLetterH2;
                    textLetterContent.textContent = textLetterP;
                    if (autoTransitionTimer) clearTimeout(autoTransitionTimer);
                    autoTransitionTimer = setTimeout(() => {
                        if ($('.wrapperLetterForm').is(':visible')) {
                            startGalaxyExperience();
                        }
                    }, 3500);
                } else {
                    startGalaxyExperience();
                }
            });
        });
        var leafOne = document.querySelector('.leafOne');
        var stickLine = document.querySelector('.stickLine');
        var leafTwo = document.querySelector('.leafTwo');
        var leafS1 = document.querySelector('.leafS1');
        var rose1 = document.querySelector('.rose1');
        var rose2 = document.querySelector('.rose2');
        var rose3 = document.querySelector('.rose3');
        var rose4 = document.querySelector('.rose4');

        var lineDrawing = anime({
            targets: [leafOne, stickLine, leafTwo, leafS1, rose1, rose2, rose3, rose4],
            strokeDashoffset: [anime.setDashoffset, 0],
            easing: 'easeInOutCubic',
            duration: 4000,
            begin: function (anim) {
                //Leaf One
                leafOne.setAttribute("stroke", "black");
                leafOne.setAttribute("fill", "none");
                // Leaf Two
                leafTwo.setAttribute("stroke", "black");
                leafTwo.setAttribute("fill", "none");
                //Stick
                stickLine.setAttribute("stroke", "black");
                stickLine.setAttribute("fill", "none");
                // Leaf S1
                leafS1.setAttribute("stroke", "black");
                leafS1.setAttribute("fill", "none");
                //Rose One
                rose1.setAttribute("stroke", "black");
                rose1.setAttribute("fill", "none");
                //Rose Two
                rose2.setAttribute("stroke", "black");
                rose2.setAttribute("fill", "none");
                //Rose Three
                rose3.setAttribute("stroke", "black");
                rose3.setAttribute("fill", "none");
                //Rose Three
                rose4.setAttribute("stroke", "black");
                rose4.setAttribute("fill", "none");
            },
            complete: function (anim) {
                //Leaf One
                leafOne.setAttribute("fill", "#9CDD05");
                leafOne.setAttribute("stroke", "none");
                //Leaf Two 
                leafTwo.setAttribute("fill", "#9CDD05");
                leafTwo.setAttribute("stroke", "none");
                //Stick
                stickLine.setAttribute("fill", "#83AA2E");
                stickLine.setAttribute("stroke", "none");
                // Leaf S1
                leafS1.setAttribute("fill", "#9CDD05");
                leafS1.setAttribute("stroke", "none");
                // Rose 1
                rose1.setAttribute("fill", "#F37D79");
                rose1.setAttribute("stroke", "none");
                // Rose 2
                rose2.setAttribute("fill", "#D86666");
                rose2.setAttribute("stroke", "none");
                // Rose 3
                rose3.setAttribute("fill", "#F37D79");
                rose3.setAttribute("stroke", "none");
                // Rose 3
                rose4.setAttribute("fill", "#D86666");
                rose4.setAttribute("stroke", "none");
            },
            autoplay: true,
        });

    </script>
